<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link rel="stylesheet" href="style.css?v=20261023-card-height-fix1">
</head>
<body>
  <header class="hero">
    <div class="top-controls" id="topControls">
      <button type="button" id="searchToggle" class="top-control-button icon-control header-search-toggle" aria-label="Open search" title="Open search" aria-expanded="false" aria-controls="headerSearchPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.8 4.8"/></svg>
      </button>
      <button type="button" id="languageToggle" class="top-control-button language-toggle" aria-label="Switch to English">English</button>
      <button type="button" id="themeToggle" class="top-control-button theme-button" aria-label="Change theme">🌙</button>
    </div>

    <div class="header-search-panel" id="headerSearchPanel" hidden>
      <label class="visually-hidden" for="searchInput" id="searchLabel">Search dishes</label>
      <input type="search" id="searchInput" placeholder="Search dishes..." autocomplete="off" aria-controls="searchSuggestions" aria-expanded="false" aria-autocomplete="list">
      <button type="button" id="closeSearch" class="header-search-submit icon-control" aria-label="Apply search and close" title="Apply search and close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.8 4.8"/></svg>
      </button>
      <div id="searchSuggestions" class="search-suggestions" role="listbox" aria-label="Matching dishes" hidden></div>
    </div>

    <div class="hero-content">
      <h1>Georgian House</h1>
      <p id="heroSubtitle">ტრადიციული ქართული სამზარეულო</p>
    </div>
  </header>

  <main>
    <section class="menu-header">
      <h2 id="menuHeading">მენიუ</h2>
    </section>

    <div class="menu-toolbar" aria-label="Menu categories and display options">
      <div class="category-filter-row"><nav id="categoryButtons" class="categories" aria-label="Menu categories"></nav></div>
      <div class="display-controls">
        <div class="control-group" role="group" aria-label="Sort menu">
          <button type="button" id="sortDefault" class="sort-button icon-control active" data-sort="default" aria-label="Restaurant order" title="Restaurant order" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg>
          </button>
          <button type="button" id="sortAsc" class="sort-button icon-control" data-sort="priceAsc" aria-label="Price low to high" title="Price low to high" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 5 5 5-5M9 21V3"/><path d="M16 8h5M16 12h4M16 16h3"/></svg>
          </button>
          <button type="button" id="sortDesc" class="sort-button icon-control" data-sort="priceDesc" aria-label="Price high to low" title="Price high to low" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 5-5 5 5M9 3v18"/><path d="M16 8h5M16 12h4M16 16h3"/></svg>
          </button>
        </div>
        <div class="control-group" role="group" aria-label="Menu view">
          <button type="button" id="cardViewButton" class="display-button icon-control active" aria-label="Card view" title="Card view" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 12v9"/><circle cx="8" cy="8" r="1"/></svg>
          </button>
          <button type="button" id="listViewButton" class="display-button icon-control" aria-label="List view" title="List view" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h10M8 12h10M8 16h10"/><path d="M5.5 8h.01M5.5 12h.01M5.5 16h.01"/></svg>
          </button>
        </div>
        <div class="control-group" role="group" aria-label="Menu item size">
          <button type="button" class="size-button icon-control" data-size="small" id="smallSizeButton" aria-label="Small items" title="Small items" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="5" height="5" rx="1"/><rect x="14" y="5" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><rect x="14" y="14" width="5" height="5" rx="1"/></svg>
          </button>
          <button type="button" class="size-button icon-control active" data-size="medium" id="mediumSizeButton" aria-label="Medium items" title="Medium items" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="8" rx="1.5"/><rect x="13" y="4" width="8" height="8" rx="1.5"/><path d="M3 17h18"/></svg>
          </button>
          <button type="button" class="size-button icon-control" data-size="large" id="largeSizeButton" aria-label="Large items" title="Large items" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M3 21h18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <section id="menuContainer" class="menu-sections" aria-live="polite"></section>
  </main>

  <footer>
    <h3>Georgian House</h3>
    <p id="footerHours">Open every day: 10:00 - 23:00</p>
    <p>+995 555 123 456</p>
    <p>Tbilisi, Georgia</p>
    <a href="admin/index.html" class="footer-admin-link" id="adminButton">Admin</a>
  </footer>
  <dialog id="dishDetailDialog" class="dish-detail-dialog" aria-labelledby="dishDetailName">
    <button type="button" class="dish-detail-close" aria-label="Close dish details" title="Close">×</button>
    <div id="dishDetailBody" class="dish-detail-body"></div>
  </dialog>
  <script src="script.js?v=20261023-card-height-fix1"></script>
</body>
</html>
